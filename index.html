const DBNAME="form_mat_v2_db",STORE="state",STATEKEY="main";
let state={start:"2026-09-14",checks:{},weights:[],shop:{},kcalGoal:1750,proteinGoal:115,weeks:structuredClone(DEFAULTS.weeks),meals:structuredClone(DEFAULTS.meals)};

const FOOD_RULES=[
 {keys:["cottage cheese"],type:"beger",grams:400,kcal100:92,protein100:13},
 {keys:["skyr"],type:"beger",grams:160,kcal100:63,protein100:10},
 {keys:["havregryn","havre"],type:"g",kcal100:370,protein100:13},
 {keys:["lettmelk","melk"],type:"dl",kcal100:46,protein100:3.5},
 {keys:["egg"],type:"stk",grams:60,kcal100:143,protein100:13},
 {keys:["banan"],type:"stk",grams:120,kcal100:89,protein100:1.1},
 {keys:["kyllingfilet","kylling"],type:"g",kcal100:110,protein100:23},
 {keys:["karbonadedeig"],type:"g",kcal100:125,protein100:21},
 {keys:["laks"],type:"g",kcal100:208,protein100:20},
 {keys:["ris"],type:"g",kcal100:350,protein100:7},
 {keys:["pasta"],type:"g",kcal100:350,protein100:12},
 {keys:["potet","poteter"],type:"g",kcal100:77,protein100:2}
];

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadState(){try{const db=await openDB(),tx=db.transaction(STORE,"readonly"),rq=tx.objectStore(STORE).get(STATEKEY);return await new Promise(resolve=>{rq.onsuccess=()=>resolve(rq.result||null);rq.onerror=()=>resolve(null)})}catch(e){return null}}
async function save(){try{const db=await openDB(),tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(state,STATEKEY)}catch(e){localStorage.setItem(STATEKEY,JSON.stringify(state))}}
function tab(n){document.querySelectorAll(".panel").forEach(x=>x.classList.remove("active"));document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===n));document.getElementById(n).classList.add("active");scrollTo(0,0)}
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function info(){const s=new Date(state.start+"T12:00:00"),n=new Date(),d=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate(),12)-s)/86400000);return{week:Math.min(12,Math.max(1,Math.floor(d/7)+1)),di:((d%7)+7)%7}}
function cb(id,title,sub=""){return `<label class="checkrow"><input type="checkbox" ${state.checks[id]?"checked":""} onchange="state.checks['${id}']=this.checked;save();renderAll()"><span><b>${title}</b>${sub?`<small>${sub}</small>`:""}</span></label>`}
function dayTotals(di,week){let k=0,p=0;state.meals[di][1].forEach((m,i)=>{if(state.checks[`w${week}d${di}m${i}`]){k+=Number(m.kcal)||0;p+=Number(m.protein)||0}});return[k,p]}
function bars(di,week){const [k,p]=dayTotals(di,week),kp=Math.min(100,Math.round(k/state.kcalGoal*100)),pp=Math.min(100,Math.round(p/state.proteinGoal*100));return `<div class="metric"><strong>Kaloriar: ${k} / ${state.kcalGoal} kcal</strong><div class="bar"><div style="width:${kp}%"></div></div><div class="barline"><span>${kp}%</span><span>${Math.max(0,state.kcalGoal-k)} kcal att</span></div></div><div class="metric"><strong>Protein: ${Math.round(p)} / ${state.proteinGoal} g</strong><div class="bar protein"><div style="width:${pp}%"></div></div><div class="barline"><span>${pp}%</span><span>${Math.max(0,Math.round(state.proteinGoal-p))} g att</span></div></div>`}

function estimateFood(text){
 const t=text.toLowerCase().replace(",","."); let kcal=0,protein=0,hits=0;
 FOOD_RULES.forEach(f=>{
  if(!f.keys.some(k=>t.includes(k))) return;
  let grams=null;
  if(f.type==="g"){let m=t.match(/(\d+(?:\.\d+)?)\s*g\b/); if(m) grams=parseFloat(m[1]);}
  if(f.type==="dl"){let m=t.match(/(\d+(?:\.\d+)?)\s*dl/); if(m) grams=parseFloat(m[1])*100;}
  if(f.type==="stk"){let m=t.match(/(\d+(?:\.\d+)?)\s*(?:stk\s*)?(?:egg|banan)/); grams=(m?parseFloat(m[1]):1)*f.grams;}
  if(f.type==="beger"){let m=t.match(/(\d+(?:\.\d+)?)\s*beger/); grams=(m?parseFloat(m[1]):1)*f.grams;}
  if(grams!==null){kcal+=grams*f.kcal100/100;protein+=grams*f.protein100/100;hits++;}
 });
 return hits?[Math.round(kcal),Math.round(protein)]:null;
}

function mealCard(di,j,week,edit){
 const m=state.meals[di][1][j],id=`w${week}d${di}m${j}`,eid=`me${di}_${j}`;
 let e="";
 if(edit){
   e=`<div id="${eid}" class="editor"><input type="text" id="${eid}_text" value="${m.text.replaceAll('"','&quot;')}"><div class="formgrid"><input type="number" id="${eid}_k" value="${m.kcal}" placeholder="kcal"><input type="number" id="${eid}_p" value="${m.protein}" placeholder="protein g"></div><button class="btn" onclick="autoEstimate(${di},${j},'${eid}')">Estimer frå tekst</button> <button class="btn alt" onclick="saveMeal(${di},${j},'${eid}')">Lagre</button><div class="muted" style="margin-top:8px;font-size:12px">Estimat er omtrentlege. Bruk pakken for best presisjon.</div></div>`;
 }
 return `<div class="checkrow"><input type="checkbox" ${state.checks[id]?"checked":""} onchange="state.checks['${id}']=this.checked;save();renderAll()"><div style="flex:1"><div class="headrow"><b>${m.name}</b>${edit?`<button class="btn small alt" onclick="toggle('${eid}')">Endre</button>`:""}</div><small>${m.text}</small><div class="mealmeta"><span class="chip">≈ ${m.kcal} kcal</span><span class="chip">≈ ${m.protein} g protein</span></div></div></div>${e}`;
}
function toggle(id){document.getElementById(id).classList.toggle("open")}
function autoEstimate(di,j,eid){const text=document.getElementById(eid+"_text").value,est=estimateFood(text);if(!est){alert("Eg kjenner ikkje igjen nok av maten. Skriv inn kcal og protein manuelt frå pakka.");return}document.getElementById(eid+"_k").value=est[0];document.getElementById(eid+"_p").value=est[1]}
function saveMeal(di,j,eid){let m=state.meals[di][1][j];m.text=document.getElementById(eid+"_text").value;m.kcal=Number(document.getElementById(eid+"_k").value)||0;m.protein=Number(document.getElementById(eid+"_p").value)||0;save();renderAll()}

function renderToday(){
 const i=info(),md=state.meals[i.di],td={0:0,2:1,4:2}[i.di];let tr=`<div class="card"><h3>Dagens trening</h3><div class="muted">Ingen planlagt økt i dag.</div></div>`;
 if(td!==undefined){let s=state.weeks[i.week-1].sessions[td];tr=`<div class="card"><h3>Dagens trening</h3>${cb(`w${i.week}t${td}`,s.name,s.day)}<ul class="workitems">${s.items.map(x=>`<li>${x}</li>`).join("")}</ul></div>`}
 document.getElementById("today").innerHTML=`<div class="card"><div class="daytitle">${md[0]}</div><div class="muted">Veke ${i.week} av 12</div>${bars(i.di,i.week)}</div>${tr}<div class="card"><h3>Dagens mat</h3>${md[1].map((m,j)=>mealCard(i.di,j,i.week,false)).join("")}</div>`;
}
function renderFood(){
 const i=info();
 document.getElementById("food").innerHTML=`<div class="card"><h2>Matplan</h2><div class="muted">Endra måltid og mål direkte her. Huk av det som faktisk er ete.</div><div class="formgrid"><label>Kcal-mål<input type="number" value="${state.kcalGoal}" onchange="state.kcalGoal=Number(this.value);save();renderAll()"></label><label>Proteinmål<input type="number" value="${state.proteinGoal}" onchange="state.proteinGoal=Number(this.value);save();renderAll()"></label></div></div>`+state.meals.map((d,di)=>`<div class="card"><h2>${d[0]}</h2>${bars(di,i.week)}${d[1].map((m,j)=>mealCard(di,j,i.week,true)).join("")}</div>`).join("");
}
function renderTraining(){
 document.getElementById("training").innerHTML=state.weeks.map((w,wi)=>{let done=w.sessions.filter((s,j)=>state.checks[`w${w.week}t${j}`]).length;return `<div class="card"><div class="weekhead"><div><h2>Veke ${w.week}</h2><div class="muted">${w.phase}</div></div><span class="pill">${done}/3</span></div>${w.sessions.map((s,j)=>{let eid=`we${wi}_${j}`;return `<div>${cb(`w${w.week}t${j}`,s.name,s.day)}<ul class="workitems">${s.items.map(x=>`<li>${x}</li>`).join("")}</ul><button class="btn small alt" onclick="toggle('${eid}')">Endre økt</button><div id="${eid}" class="editor"><input id="${eid}_name" type="text" value="${s.name}"><input id="${eid}_day" type="text" value="${s.day}"><textarea id="${eid}_items">${s.items.join("\n")}</textarea><button class="btn" onclick="saveWorkout(${wi},${j},'${eid}')">Lagre økt</button></div></div>`}).join("")}</div>`}).join("");
}
function saveWorkout(wi,j,eid){let s=state.weeks[wi].sessions[j];s.name=document.getElementById(eid+"_name").value;s.day=document.getElementById(eid+"_day").value;s.items=document.getElementById(eid+"_items").value.split("\n").map(x=>x.trim()).filter(Boolean);save();renderAll()}
function renderWeight(){let a=[...state.weights].sort((x,y)=>y.date.localeCompare(x.date));document.getElementById("weight").innerHTML=`<div class="card"><h2>Vektlogg</h2><div class="formgrid"><input id="wd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="wv" type="number" step="0.1" placeholder="kg"></div><button class="btn" onclick="addWeight()">Lagre vekt</button>${a.map(x=>`<div class="weightitem"><span>${x.date}</span><b>${x.value} kg</b></div>`).join("")}</div><div class="card"><h3>Startdato</h3><input type="date" value="${state.start}" onchange="state.start=this.value;save();renderAll()"></div>`}
function addWeight(){let d=document.getElementById("wd").value,v=parseFloat(document.getElementById("wv").value);if(!d||!v)return;state.weights=state.weights.filter(x=>x.date!==d);state.weights.push({date:d,value:v});save();renderWeight()}
function renderShop(){document.getElementById("shop").innerHTML=`<div class="card"><h2>Handleliste</h2>${DEFAULTS.shopping.map((x,i)=>`<label class="shoprow"><span><input type="checkbox" ${state.shop[i]?"checked":""} onchange="state.shop[${i}]=this.checked;save()"> ${x[0]}</span><b>${x[1]}</b></label>`).join("")}</div>`}
function renderAll(){renderToday();renderTraining();renderFood();renderWeight();renderShop()}
(async()=>{const old=await loadState();if(old)state=Object.assign(state,old);if(!state.weeks)state.weeks=structuredClone(DEFAULTS.weeks);if(!state.meals)state.meals=structuredClone(DEFAULTS.meals);renderAll();if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{})})();
</script></body></html>
