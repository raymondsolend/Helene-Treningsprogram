<html lang="nn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Form + Mat">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>12 veker – Form + Mat</title>
<style>
:root{--bg:#0a0f15;--card:#151b23;--card2:#202936;--line:#2b3440;--text:#f8fafc;--muted:#b9c2cf;--green:#22c55e}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{padding-bottom:80px}.app{max-width:760px;margin:auto;padding:16px}
.hero{background:#111827;border-radius:24px;padding:22px;margin:8px 0 16px}.hero h1{font-size:29px;margin:0 0 8px}.muted{color:var(--muted)}
.bar{height:12px;background:#374151;border-radius:99px;overflow:hidden;margin:18px 0 8px}.bar>div{height:100%;width:0;background:var(--green)}.prow{display:flex;justify-content:space-between;font-size:14px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;position:sticky;top:0;z-index:20;background:var(--bg);padding:8px 0 12px}
.tab{border:0;border-radius:14px;padding:13px 4px;background:#25303c;color:var(--text);font-weight:800;font-size:13px}.tab.active{background:#f8fafc;color:#111827}
.panel{display:none}.panel.active{display:block}.card{background:var(--card);border-radius:22px;padding:20px;margin:14px 0}.card h2{font-size:25px;margin:0 0 8px}.card h3{font-size:21px;margin:0 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}.stat{background:var(--card2);border-radius:18px;padding:16px 8px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}
.checkrow{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line)}.checkrow:first-child{border-top:0}
input[type=checkbox]{width:29px;height:29px;accent-color:var(--green);flex:0 0 auto;margin-top:2px}.checkrow strong{font-size:18px;display:block}.checkrow small{display:block;color:var(--muted);font-size:14px;line-height:1.4;margin-top:3px}
ul{margin:10px 0 0 37px;color:var(--muted);font-size:17px;line-height:1.55}li{margin:3px 0}
.weekhead{display:flex;justify-content:space-between;gap:12px;align-items:center}.pill{background:var(--card2);padding:7px 12px;border-radius:99px;font-weight:800}
textarea,input[type=date],input[type=number]{width:100%;margin-top:10px;border:1px solid #3a4554;background:#0f141b;color:white;border-radius:13px;padding:12px;font:inherit}
textarea{min-height:90px}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:13px;padding:12px 15px;font-weight:800;background:#f8fafc;color:#111827;margin-top:10px}
.weightitem,.shoprow{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}.shoprow input{width:24px;height:24px}
.daytitle{font-size:34px;font-weight:900}.ok{font-size:12px;color:#86efac;margin-top:8px}.note{background:#18202a;border:1px solid #334155}
@media(max-width:430px){.hero h1{font-size:26px}.tab{font-size:12px;padding:12px 2px}.stat b{font-size:18px}}
</style>
</head>

const DBNAME="form_mat_db", STORE="state", STATEKEY="main";
let state={start:"2026-09-14",checks:{},notes:{},weights:[],shop:{}};

function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>r.result.createObjectStore(STORE);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function loadState(){try{const db=await openDB();const tx=db.transaction(STORE,"readonly");const rq=tx.objectStore(STORE).get(STATEKEY);return await new Promise(resolve=>{rq.onsuccess=()=>resolve(rq.result||state);rq.onerror=()=>resolve(state)})}catch(e){try{return JSON.parse(localStorage.getItem(STATEKEY))||state}catch(_){return state}}}
async function save(){try{const db=await openDB();const tx=db.transaction(STORE,"readwrite");tx.objectStore(STORE).put(state,STATEKEY)}catch(e){localStorage.setItem(STATEKEY,JSON.stringify(state))}progress()}

function tab(n){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===n));document.getElementById(n).classList.add('active');scrollTo(0,0)}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));

function info(){const s=new Date(state.start+"T12:00:00"),n=new Date(),d=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate(),12)-s)/86400000);return {week:Math.min(12,Math.max(1,Math.floor(d/7)+1)),di:((d%7)+7)%7,days:d}}

function cb(id,title,sub=""){return `<label class="checkrow"><input type="checkbox" ${state.checks[id]?'checked':''} onchange="state.checks['${id}']=this.checked;save()"><span><strong>${title}</strong>${sub?`<small>${sub}</small>`:''}</span></label>`}

function renderToday(){
 const i=info(),md=DATA.meals[i.di];
 const map={0:0,2:1,4:2,6:3}, td=map[i.di];
 let t=`<div class="card"><h3>Dagens trening</h3><div class="muted">Ingen planlagt hovudøkt i dag. Kvile, gåtur eller lett aktivitet er fint.</div></div>`;
 if(td!==undefined){const s=DATA.weeks[i.week-1].sessions[td];t=`<div class="card"><h3>Dagens trening</h3>${cb(`w${i.week}t${td}`,s.name,s.day)}<ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`}
 document.getElementById('today').innerHTML=`
 <div class="card"><div class="daytitle">${md[0]}</div><div class="muted">Veke ${i.week} av 12</div>
 <div class="stats"><div class="stat"><b>≈1750</b><span>kcal/dag</span></div><div class="stat"><b>110–125 g</b><span>protein</span></div><div class="stat"><b>−0,25–0,5</b><span>kg/veke</span></div></div></div>
 ${t}
 <div class="card"><h3>Dagens mat</h3>${md[1].map((m,k)=>cb(`w${i.week}d${i.di}m${k}`,m[0],m[1])).join('')}</div>
 <div class="card note"><strong>Justering</strong><div class="muted" style="margin-top:6px">Dersom vektsnittet ikkje går ned etter 2–3 veker, reduser porsjonane litt eller legg til 15–20 min roleg aktivitet 2 dagar i veka. Ikkje kutt aggressivt.</div></div>`;
}

function renderTraining(){
 document.getElementById('training').innerHTML=DATA.weeks.map(w=>{let done=w.sessions.filter((s,j)=>state.checks[`w${w.week}t${j}`]).length;return `<div class="card"><div class="weekhead"><div><h2>Veke ${w.week}</h2><div class="muted">${w.phase}</div></div><span class="pill">${done}/4</span></div>${w.sessions.map((s,j)=>`<div>${cb(`w${w.week}t${j}`,s.name,s.day)}<ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}<textarea placeholder="Notat / vekter / fart / puls" oninput="state.notes['w${w.week}']=this.value;save()">${state.notes['w'+w.week]||''}</textarea></div>`}).join('');
}

function renderFood(){
 const i=info();
 document.getElementById('food').innerHTML=`<div class="card"><h2>Matplan</h2><div class="muted">Ca. 1700–1800 kcal per dag og høgt protein. Alle varer er vanlege daglegvarer du får på REMA 1000.</div></div>`+
 DATA.meals.map((d,di)=>`<div class="card"><h2>${d[0]}</h2>${d[1].map((m,k)=>cb(`w${i.week}d${di}m${k}`,m[0],m[1])).join('')}</div>`).join('');
}

function renderWeight(){
 let a=[...state.weights].sort((x,y)=>y.date.localeCompare(x.date));
 document.getElementById('weight').innerHTML=`<div class="card"><h2>Vektlogg</h2><div class="muted">Veg deg helst 2–3 morgonar i veka, etter toalett og før frukost. Sjå på vekesnitt, ikkje enkeltdagar.</div><div class="twocol"><input id="wd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="wv" type="number" step="0.1" placeholder="kg"></div><button class="btn" onclick="addWeight()">Lagre vekt</button>${a.map(x=>`<div class="weightitem"><span>${x.date}</span><strong>${x.value} kg</strong></div>`).join('')}</div><div class="card"><h3>Startdato</h3><input type="date" value="${state.start}" onchange="state.start=this.value;save();renderAll()"></div>`;
}
function addWeight(){let d=document.getElementById('wd').value,v=parseFloat(document.getElementById('wv').value);if(!d||!v)return;state.weights=state.weights.filter(x=>x.date!==d);state.weights.push({date:d,value:v});save();renderWeight()}

function renderShop(){document.getElementById('shop').innerHTML=`<div class="card"><h2>Handleliste – ca. 1 veke</h2>${DATA.shopping.map((x,i)=>`<label class="shoprow"><span><input type="checkbox" ${state.shop[i]?'checked':''} onchange="state.shop[${i}]=this.checked;save()"> ${x[0]}</span><strong>${x[1]}</strong></label>`).join('')}</div>`}

function progress(){let ids=[];for(let w=1;w<=12;w++)for(let j=0;j<4;j++)ids.push(`w${w}t${j}`);let d=ids.filter(x=>state.checks[x]).length,p=Math.round(d/48*100);document.getElementById('bar').style.width=p+'%';document.getElementById('count').textContent=`${d} av 48 treningsøkter`;document.getElementById('pct').textContent=p+'%'}
function renderAll(){renderToday();renderTraining();renderFood();renderWeight();renderShop();progress()}
(async()=>{state=Object.assign(state,await loadState());renderAll();if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script>
</body></html>
