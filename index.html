*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}.app{max-width:780px;margin:auto;padding:15px}.hero,.card{background:var(--card);border-radius:22px;padding:20px;margin:13px 0}.hero{background:#111827}h1{font-size:27px;margin:0 0 7px}h2{margin:0 0 8px}h3{margin:0 0 10px}.muted,.tiny{color:var(--muted)}.tiny{font-size:13px;line-height:1.45}.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;position:sticky;top:0;background:var(--bg);z-index:10;padding:7px 0 10px}.tab,.btn{border:0;border-radius:13px;padding:12px 7px;font-weight:800}.tab{background:#25303c;color:#fff}.tab.active{background:#fff;color:#111827}.btn{background:#fff;color:#111827}.btn.alt{background:#25303c;color:#fff}.btn.green{background:#16a34a;color:#fff}.btn.danger{background:#4a2020;color:#fecaca}.btn.small{padding:8px 10px;font-size:12px}.panel{display:none}.panel.active{display:block}.row{display:flex;gap:10px;align-items:center}.grow{flex:1}.pill,.chip{background:var(--card2);padding:6px 10px;border-radius:99px;font-size:13px}.chip.blue{background:#172b46;color:#bfdbfe}.chip.green{background:#173522;color:#bbf7d0}.session{border-top:1px solid var(--line);padding-top:14px;margin-top:14px}.exercise{background:#101720;border-radius:15px;padding:12px;margin:8px 0}.exgrid{display:grid;grid-template-columns:1fr 92px;gap:8px;align-items:center}.exname{font-weight:800}.exsets{font-size:13px;color:var(--muted)}input[type=checkbox]{width:27px;height:27px;accent-color:var(--green)}input[type=number],input[type=text],input[type=date],textarea,select{width:100%;border:1px solid #3b4655;background:#0f141b;color:#fff;border-radius:12px;padding:10px;font:inherit}textarea{min-height:90px}.editor{display:none;background:#101720;border-radius:16px;padding:13px;margin:8px 0}.editor.open{display:block}.bar{height:11px;background:#374151;border-radius:99px;overflow:hidden;margin:8px 0}.bar>div{height:100%;background:var(--green)}.bar.protein>div,.bar.blue>div{background:var(--blue)}.barline,.metricline{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}.metric{margin-top:13px}.meal{border-top:1px solid var(--line);padding:12px 0}.meal:first-of-type{border-top:0}.mealmeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:6px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.summary{background:#111923;border-radius:16px;padding:14px;margin-top:12px}.complete{border:1px solid #365f45;background:#13231a}.warning{border:1px solid #7c4a1b;background:#291b10}.accent{border:1px solid #314158;background:#111a26}.bluecard{border:1px solid #294768;background:#101c2b}.notice{background:#101720;border-radius:14px;padding:12px;margin-top:12px}.daytitle{font-size:32px;font-weight:900}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.saveok{font-size:12px;color:#86efac;margin-top:8px}.weeknav{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;margin-top:12px}.weeknav strong{text-align:center}.foodday{background:var(--card);border-radius:20px;margin:12px 0;overflow:hidden}.foodday summary{list-style:none;cursor:pointer;padding:17px}.foodday summary::-webkit-details-marker{display:none}.fooddaybody{padding:0 17px 17px}.foodhead{display:flex;justify-content:space-between;align-items:center;gap:10px}.foodtitle{display:flex;gap:10px;align-items:center}.foodfocus{margin-top:4px;font-size:13px;color:var(--muted)}.shopgroup{margin-top:16px}.shopgroup h3{margin:0 0 6px}.shoprow,.weightitem{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-top:1px solid var(--line)}.shopname{flex:1}.shopqty{color:var(--muted);font-size:13px;text-align:right}.sectionhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.factorlist{display:grid;gap:8px;margin-top:12px}.factor{background:#101720;border-radius:13px;padding:11px;display:flex;justify-content:space-between;gap:12px}.factor span{color:var(--muted)}

</style></head><body><div class="app">
<div class="hero"><h1>Helene – 12 veker</h1><div class="muted">Styrke + kondisjon + mat • adaptiv progresjon frå veke til veke</div><div class="saveok">✓ Alt blir lagra lokalt på telefonen</div></div>
<div class="tabs"><button class="tab active" data-tab="today">I dag</button><button class="tab" data-tab="training">Trening</button><button class="tab" data-tab="food">Mat</button><button class="tab" data-tab="weight">Vekt</button><button class="tab" data-tab="shop">Handle</button></div>
<div id="today" class="panel active"></div><div id="training" class="panel"></div><div id="food" class="panel"></div><div id="weight" class="panel"></div><div id="shop" class="panel"></div></div>
<script>
const PLAN=[
["Grunnlag",["Knebøy med stang|3×8","Benkpress|3×8","Stangroing|3×10","Rumensk markløft|3×8","Planke|3×30–45 sek"],["10 min roleg oppvarming","6×2 min raskt / 2 min roleg","5–10 min roleg nedjogg"],["Markløft|3×5","Benkpress|3×10","Utfall bakover|3×8 per bein","Ståande skulderpress|3×8","Stangroing|3×10","Beinhev / planke|3 sett"]],
["Bygging",["Knebøy med stang|4×6","Benkpress|4×6","Stangroing|4×8","Rumensk markløft|3×8","Planke|3×45–60 sek"],["10 min roleg oppvarming","5×3 min raskt / 2 min roleg","5–10 min roleg nedjogg"],["Markløft|3×5","Benkpress|3×8","Utfall bakover|3×10 per bein","Ståande skulderpress|3×6–8","Stangroing|3×8","Beinhev / situps|3×12–15"]],
["Styrke + kondisjon",["Knebøy med stang|4×5","Benkpress|4×5","Stangroing|4×6–8","Rumensk markløft|3×6–8","Planke|3×60 sek"],["10 min roleg oppvarming","4×4 min hardt / 3 min roleg","5–10 min roleg nedjogg"],["Markløft|4×4","Benkpress|3×6–8","Utfall bakover|3×10 per bein","Ståande skulderpress|3×6","Stangroing|3×8","Beinhev / situps|3×15"]]];
const DEFAULT_MEALS=[["Måndag",[["Frukost","50 g havregryn + 2 dl lettmelk + bær + 1 egg",420,22],["Mellom","Skyr + 1 frukt",180,17],["Lunsj","3 grove skiver med kalkun/skinke + lettost + grønsaker",410,30],["Middag","150 g kyllingfilet + 70 g tørr ris + grønsaker + lett saus",530,44],["Kveldsmat","150 g cottage cheese + bær",190,21]]],["Tysdag",[["Frukost","2 egg + 2 grove skiver + tomat/agurk",370,23],["Mellom","Skyr/yoghurt + eple",190,16],["Lunsj","Tunfisksalat + 2 grove skiver",390,33],["Middag","150 g karbonadedeig + 70 g tørr pasta + tomatsaus + grønsaker",560,42],["Kveldsmat","2 knekkebrød med cottage cheese eller skinke",220,16]]],["Onsdag",[["Frukost","50 g havregryn + melk + banan",390,16],["Mellom","Skyr + bær",160,17],["Lunsj","3 grove skiver med egg og skinke",440,30],["Middag","150 g kylling + poteter + grønsaker + litt saus",520,42],["Kveldsmat","2 knekkebrød + cottage cheese",220,17]]],["Torsdag",[["Frukost","2 egg + 2 grove skiver + frukt",420,23],["Mellom","Skyr",130,16],["Lunsj","Kyllingsalat + 1 grov brødskive",420,39],["Middag","150 g laks + poteter + brokkoli/gulrot",560,36],["Kveldsmat","Cottage cheese + bær",190,21]]],["Fredag",[["Frukost","50 g havregryn + lettmelk + bær + 1 egg",420,22],["Mellom","Skyr + frukt",180,17],["Lunsj","3 grove skiver med kalkun/skinke + lettost",410,30],["Middag","Taco: 150 g karbonadedeig + 2 små tortillas + grønsaker + salsa + litt ost",570,40],["Kveldsmat","2 knekkebrød med egg/skinke",240,17]]],["Laurdag",[["Frukost","Omelett av 2 egg + 2 grove skiver + grønsaker",390,24],["Mellom","Yoghurt + frukt",190,14],["Lunsj","Wrap med kylling, salat og lett dressing",430,35],["Middag","Heimelaga burger + ovnsbakte poteter + salat",580,40],["Kveldsmat","Skyr eller cottage cheese",180,20]]],["Søndag",[["Frukost","50 g havregryn + melk + banan",390,16],["Mellom","Skyr + bær",160,17],["Lunsj","3 grove skiver med egg/skinke + grønsaker",440,30],["Middag","150 g kylling eller laks + ris/poteter + grønsaker",540,40],["Kveldsmat","2 knekkebrød + cottage cheese",220,17]]]];
const FOOD_FOCUS=['Styrkedag – jamn energi og protein rundt økta','Kviledag – grønsaker, protein og moderat energiinntak','Intervall – karbohydrat før økta og protein etterpå','Kviledag – mettande mat og god væskebalanse','Styrkedag – energi før økta og protein etterpå','Fleksibel dag – hald porsjonane kontrollerte','Restitusjon – protein, grønsaker og førebuing til ny veke'];
const SHOP_DEFAULT=[
['Karbohydrat','Havregryn','1 pose'],['Meieri og protein','Lettmelk','3–4 L'],['Meieri og protein','Egg','18–24 stk'],['Karbohydrat','Grove brød','2 stk'],['Karbohydrat','Knekkebrød','1 pk'],['Frukt og grønt','Bananar','7–10 stk'],['Frukt og grønt','Frukt','7–10 stk'],['Frukt og grønt','Bær','2–3 pk'],['Meieri og protein','Skyr / yoghurt','7–10 stk'],['Meieri og protein','Cottage cheese','3–4 beger'],['Meieri og protein','Lettost','1 pk'],['Meieri og protein','Skinke / kalkunpålegg','2–3 pk'],['Kjøtt og fisk','Kyllingfilet','1,2–1,5 kg'],['Kjøtt og fisk','Karbonadedeig','800 g–1 kg'],['Kjøtt og fisk','Laks','400–600 g'],['Kjøtt og fisk','Tunfisk','2–3 boksar'],['Karbohydrat','Ris','1 pk'],['Karbohydrat','Pasta','1 pk'],['Karbohydrat','Poteter','1,5–2 kg'],['Anna','Tortillas / wraps','1–2 pk'],['Frukt og grønt','Salat / agurk / tomat','etter behov'],['Frukt og grønt','Brokkoli / gulrot / wokgrønsaker','rikelig'],['Anna','Salsa / tomatsaus','1–2 glas'],['Anna','Lett dressing / saus','1 flaske'],['Anna','Nøtter','1 liten pose']];
const DBNAME='form_mat_v2_db',STORE='state',STATEKEY='main';
function makeWeeks(){return Array.from({length:12},(_,i)=>{const p=i<4?PLAN[0]:i<8?PLAN[1]:PLAN[2],str=a=>a.map(x=>{const[name,sets]=x.split('|');return{name,sets:sets||'',type:/planke|beinhev/i.test(name)?'body':'strength',log:{done:false,weight:null,effort:'ok'}}});return{week:i+1,phase:p[0],completed:false,sessions:[{name:'Styrke A',day:'Måndag',done:false,exercises:str(p[1])},{name:'Intervall / kondisjon',day:'Onsdag',done:false,exercises:p[2].map(x=>({name:x,sets:'',type:'cardio',log:{done:false}}))},{name:'Styrke B',day:'Fredag',done:false,exercises:str(p[3])}]}})}
function makeMeals(){return DEFAULT_MEALS.map(d=>[d[0],d[1].map((m,j)=>({id:'meal-'+d[0].slice(0,3).toLowerCase()+'-'+j,name:m[0],text:m[1],kcal:m[2],protein:m[3]}))])}
function makeShopping(){return SHOP_DEFAULT.map((x,i)=>({id:'s'+i,category:x[0],name:x[1],qty:x[2],custom:false}))}
let state={start:'2026-09-14',checks:{},weights:[],kcalGoal:1750,proteinGoal:115,weeks:makeWeeks(),meals:makeMeals(),foodWeek:1,foodOpenDay:0,shopping:makeShopping(),shopChecks:{}};
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DBNAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function load(){try{const db=await openDB(),tx=db.transaction(STORE,'readonly'),rq=tx.objectStore(STORE).get(STATEKEY);return await new Promise(r=>{rq.onsuccess=()=>r(rq.result||null);rq.onerror=()=>r(null)})}catch(e){try{return JSON.parse(localStorage.getItem(STATEKEY))}catch(_){return null}}}
async function save(){try{localStorage.setItem(DBNAME,JSON.stringify(state))}catch(e){}try{const db=await openDB(),tx=db.transaction(STORE,'readwrite');tx.objectStore(STORE).put(state,STATEKEY)}catch(e){}}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function tab(n){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===n));document.getElementById(n).classList.add('active');scrollTo(0,0)}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
function info(){const s=new Date(state.start+'T12:00:00'),n=new Date(),d=Math.floor((new Date(n.getFullYear(),n.getMonth(),n.getDate(),12)-s)/86400000);return{week:Math.min(12,Math.max(1,Math.floor(d/7)+1)),di:((d%7)+7)%7}}
function migrate(old){if(!old){const i=info();state.foodWeek=i.week;state.foodOpenDay=i.di;return}const oldShop=old.shop;state={...state,...old};if(!old.weeks||old.weeks[0]?.sessions?.[0]?.items){const nw=makeWeeks();if(old.weeks){old.weeks.forEach((w,wi)=>w.sessions?.forEach((s,si)=>{if(nw[wi]?.sessions[si])nw[wi].sessions[si].done=!!old.checks?.[`w${wi+1}t${si}`]}))}state.weeks=nw}if(!state.meals)state.meals=makeMeals();state.meals.forEach((d,di)=>d[1].forEach((m,j)=>{if(!m.id)m.id='meal-'+di+'-'+j}));if(!Array.isArray(state.shopping))state.shopping=makeShopping();if(!state.shopChecks)state.shopChecks={};if(oldShop&&typeof oldShop==='object')Object.keys(oldShop).forEach(k=>{if(oldShop[k])state.shopChecks['s'+k]=true});const i=info();if(!state.foodWeek||state.foodWeek<1||state.foodWeek>12)state.foodWeek=i.week;if(state.foodOpenDay==null)state.foodOpenDay=i.di}
function inc(name){return /markløft|knebøy|rumensk/i.test(name)?5:2.5}
function finishWeek(wi){const w=state.weeks[wi],done=w.sessions.filter(s=>s.done).length;if(!confirm(`Ferdig med veke ${w.week}? ${done}/3 økter er registrert.`))return;if(wi<11){const next=state.weeks[wi+1];let total=0,xdone=0,changes=[];w.sessions.forEach(s=>s.exercises.forEach(e=>{if(e.type==='strength'){total++;if(e.log?.done)xdone++}}));const ratio=total?xdone/total:0;next.sessions.forEach(ns=>ns.exercises.forEach(ne=>{if(ne.type!=='strength')return;let src=null;w.sessions.forEach(s=>s.exercises.forEach(e=>{if(e.type==='strength'&&e.name.toLowerCase()===ne.name.toLowerCase()&&e.log?.weight!=null)src=e}));if(!src)return;let wt=Number(src.log.weight);if(src.log.done&&src.log.effort==='easy'&&done===3&&ratio>=.9)wt+=inc(src.name);else if(src.log.effort==='failed')wt=Math.max(0,Math.round(wt*.95*2)/2);ne.suggestedWeight=wt;changes.push(`${ne.name}: ${wt} kg`)}));if(done<=1||ratio<.5){next.sessions.forEach(ns=>{const cs=w.sessions.find(s=>s.name===ns.name);ns.exercises.forEach(ne=>{const ce=cs?.exercises.find(e=>e.name.toLowerCase()===ne.name.toLowerCase());if(ce)ne.sets=ce.sets})});w.adjustment={message:'Lite gjennomført. Neste veke held same treningsnivå i staden for å auke.',details:changes}}else if(done===2||ratio<.9)w.adjustment={message:'Delvis gjennomført. Neste veke held i hovudsak same vekter og går vidare kontrollert.',details:changes};else w.adjustment={message:'God gjennomføring. Neste veke går vidare som planlagt, med små auke der øvingane kjendes lette.',details:changes}}else w.adjustment={message:'Programmet er fullført.',details:[]};w.completed=true;save();renderAll()}
function reopenWeek(wi){state.weeks[wi].completed=false;save();renderAll()}
function setSession(wi,si,v){state.weeks[wi].sessions[si].done=v;state.checks[`w${wi+1}t${si}`]=v;save();renderAll()}
function setLog(wi,si,ei,k,v){const e=state.weeks[wi].sessions[si].exercises[ei];e.log=e.log||{done:false,weight:null,effort:'ok'};e.log[k]=v;save()}
function editWorkout(wi,si){document.getElementById(`ed${wi}_${si}`).classList.toggle('open')}
function saveWorkout(wi,si){const s=state.weeks[wi].sessions[si],id=`ed${wi}_${si}`;s.name=document.getElementById(id+'n').value;s.day=document.getElementById(id+'d').value;s.exercises=document.getElementById(id+'x').value.split('\n').filter(Boolean).map(line=>{const[name,sets='']=line.split('|'),old=s.exercises.find(e=>e.name===name.trim());return{name:name.trim(),sets:sets.trim(),type:/intervall|oppvarming|nedjogg/i.test(name)?'cardio':/planke|beinhev|situps/i.test(name)?'body':'strength',log:old?.log||{done:false,weight:null,effort:'ok'}}});save();renderAll()}
function weekCard(w,wi){const done=w.sessions.filter(s=>s.done).length;return `<div class="card ${w.completed?'complete':''}"><div class="row"><div class="grow"><h2>Veke ${w.week}</h2><div class="muted">${esc(w.phase)}</div></div><span class="pill">${done}/3</span></div>${w.sessions.map((s,si)=>`<div class="session"><div class="row"><input type="checkbox" ${s.done?'checked':''} ${w.completed?'disabled':''} onchange="setSession(${wi},${si},this.checked)"><div class="grow"><h3>${esc(s.name)}</h3><div class="muted">${esc(s.day)}</div></div>${!w.completed?`<button class="btn alt" onclick="editWorkout(${wi},${si})">Endre</button>`:''}</div>${s.exercises.map((e,ei)=>`<div class="exercise"><div class="exgrid"><div><div class="exname">${esc(e.name)}</div><div class="exsets">${esc(e.sets)}${e.suggestedWeight!=null?` • forslag ${e.suggestedWeight} kg`:''}</div></div>${e.type==='strength'?`<input type="number" step="0.5" placeholder="kg" value="${e.log?.weight??''}" ${w.completed?'disabled':''} onchange="setLog(${wi},${si},${ei},'weight',this.value?Number(this.value):null)">`:''}</div><div class="row" style="margin-top:8px"><label><input type="checkbox" ${e.log?.done?'checked':''} ${w.completed?'disabled':''} onchange="setLog(${wi},${si},${ei},'done',this.checked)"> utført</label>${e.type==='strength'?`<select ${w.completed?'disabled':''} onchange="setLog(${wi},${si},${ei},'effort',this.value)"><option value="easy" ${e.log?.effort==='easy'?'selected':''}>Lett – kunne tatt meir</option><option value="ok" ${!e.log?.effort||e.log?.effort==='ok'?'selected':''}>Passe</option><option value="hard" ${e.log?.effort==='hard'?'selected':''}>Tungt, men godkjent</option><option value="failed" ${e.log?.effort==='failed'?'selected':''}>Klarte ikkje planen</option></select>`:''}</div></div>`).join('')}<div id="ed${wi}_${si}" class="editor"><input id="ed${wi}_${si}n" value="${esc(s.name)}"><input id="ed${wi}_${si}d" value="${esc(s.day)}"><textarea id="ed${wi}_${si}x">${esc(s.exercises.map(e=>e.name+'|'+e.sets).join('\n'))}</textarea><button class="btn" onclick="saveWorkout(${wi},${si})">Lagre økt</button></div></div>`).join('')}${w.adjustment?`<div class="summary"><b>Justering etter veka</b><div>${esc(w.adjustment.message)}</div>${w.adjustment.details?.length?`<div class="muted" style="margin-top:7px">${w.adjustment.details.map(esc).join('<br>')}</div>`:''}</div>`:''}<div class="actions">${!w.completed?`<button class="btn green" onclick="finishWeek(${wi})">✓ Ferdig med veke ${w.week}</button>`:`<button class="btn alt" onclick="reopenWeek(${wi})">Opne veka igjen</button>`}</div></div>`}
function renderTraining(){document.getElementById('training').innerHTML=`<div class="card warning"><b>Adaptiv progresjon</b><div class="muted" style="margin-top:6px">Registrer kg, om øvinga blei utført og kor tung ho kjendes. Trykk «Ferdig med veka» når veka er over – også om ikkje alt blei gjort. Appen justerer neste veke automatisk.</div></div>`+state.weeks.map(weekCard).join('')}
function mealKey(w,di,j){return `w${w}d${di}m${j}`}
function planTotals(di){return state.meals[di][1].reduce((a,m)=>[a[0]+(+m.kcal||0),a[1]+(+m.protein||0)],[0,0])}
function eatenTotals(di,w){return state.meals[di][1].reduce((a,m,j)=>state.checks[mealKey(w,di,j)]?[a[0]+(+m.kcal||0),a[1]+(+m.protein||0)]:a,[0,0])}
function bars(di,w){const[pk,pp]=planTotals(di),[k,p]=eatenTotals(di,w),kp=pk?Math.round(k/pk*100):0,pr=pp?Math.round(p/pp*100):0;return `<div class="metric"><div class="metricline"><strong>${k} / ${pk} kcal</strong><span>${kp}% av dagens meny</span></div><div class="bar"><div style="width:${Math.min(100,kp)}%"></div></div><div class="barline"><span>Mål: ca. ${state.kcalGoal} kcal</span><span>${Math.max(0,pk-k)} kcal i menyen att</span></div></div><div class="metric"><div class="metricline"><strong>${Math.round(p)} / ${Math.round(pp)} g protein</strong><span>${pr}% av dagens meny</span></div><div class="bar protein"><div style="width:${Math.min(100,pr)}%"></div></div><div class="barline"><span>Mål: ca. ${state.proteinGoal} g</span><span>${Math.max(0,Math.round(pp-p))} g i menyen att</span></div></div>`}
function mealRow(di,j,w,editable){const m=state.meals[di][1][j],id=mealKey(w,di,j),eid=`m${di}_${j}`;return `<div class="meal"><div class="row"><input type="checkbox" aria-label="Måltid ete" ${state.checks[id]?'checked':''} onchange="state.checks['${id}']=this.checked;save();renderAll()"><div class="grow"><b>${esc(m.name)}</b><div class="muted">${esc(m.text)}</div><div class="mealmeta"><span class="chip">≈ ${m.kcal} kcal</span><span class="chip blue">≈ ${m.protein} g protein</span></div></div>${editable?`<button class="btn small alt" onclick="editMeal(${di},${j})">Endre</button>`:''}</div>${editable?`<div id="${eid}" class="editor"><label class="tiny">Namn<input id="${eid}n" value="${esc(m.name)}"></label><label class="tiny">Måltid<input id="${eid}t" value="${esc(m.text)}"></label><div class="formgrid"><label class="tiny">Kcal<input id="${eid}k" type="number" value="${m.kcal}"></label><label class="tiny">Protein (g)<input id="${eid}p" type="number" value="${m.protein}"></label></div><div class="actions"><button class="btn alt" onclick="estimateMeal(${di},${j})">Estimer frå tekst</button><button class="btn" onclick="saveMeal(${di},${j})">Lagre</button><button class="btn danger" onclick="resetMeal(${di},${j})">Tilbakestill</button></div><div class="tiny" style="margin-top:8px">Tekstestimatet er eit grovt overslag. Bruk næringsinnhaldet på pakka når du vil vere meir presis.</div></div>`:''}</div>`}
function editMeal(di,j){document.getElementById(`m${di}_${j}`).classList.toggle('open')}
function estimate(text){const t=text.toLowerCase().replace(/,/g,'.');let kcal=0,protein=0,hits=0;const add=(g,k,p)=>{kcal+=g*k/100;protein+=g*p/100;hits++};let m;if(t.includes('cottage cheese')){m=t.match(/(\d+(?:\.\d+)?)\s*g\s*cottage/)||t.match(/cottage cheese[^\d]*(\d+(?:\.\d+)?)\s*g/);add(m?+m[1]:400,92,13)}if(t.includes('skyr')){m=t.match(/(\d+(?:\.\d+)?)\s*g\s*skyr/);add(m?+m[1]:160,63,10)}if(t.includes('havre')){m=t.match(/(\d+(?:\.\d+)?)\s*g\s*havre/);add(m?+m[1]:50,370,13)}if(t.includes('kylling')){m=t.match(/(\d+(?:\.\d+)?)\s*g\s*kylling/);add(m?+m[1]:150,110,23)}if(t.includes('karbonadedeig')){m=t.match(/(\d+(?:\.\d+)?)\s*g\s*karbonadedeig/);add(m?+m[1]:150,125,21)}if(t.includes('laks')){m=t.match(/(\d+(?:\.\d+)?)\s*g\s*laks/);add(m?+m[1]:150,208,20)}if(t.includes('tunfisk')){m=t.match(/(\d+(?:\.\d+)?)\s*g\s*tunfisk/);add(m?+m[1]:120,116,26)}if(t.includes('ris')){m=t.match(/(\d+(?:\.\d+)?)\s*g[^+]*ris/);add(m?+m[1]:70,350,7)}if(t.includes('pasta')){m=t.match(/(\d+(?:\.\d+)?)\s*g[^+]*pasta/);add(m?+m[1]:70,350,12)}if(t.includes('potet')){m=t.match(/(\d+(?:\.\d+)?)\s*g[^+]*potet/);add(m?+m[1]:250,77,2)}if(t.includes('egg')){m=t.match(/(\d+)\s*(?:stk\s*)?egg/);const n=m?+m[1]:1;add(n*60,143,13)}if(t.includes('banan')){m=t.match(/(\d+)\s*(?:stk\s*)?banan/);add((m?+m[1]:1)*120,89,1.1)}if(t.includes('lettmelk')||t.includes(' melk')){m=t.match(/(\d+(?:\.\d+)?)\s*dl[^+]*melk/);add((m?+m[1]:2)*100,46,3.5)}if(t.includes('nøtt')){m=t.match(/(\d+(?:\.\d+)?)\s*g[^+]*nøtt/);add(m?+m[1]:20,600,20)}return hits?[Math.round(kcal),Math.round(protein)]:null}
function saveMeal(di,j){const id=`m${di}_${j}`,m=state.meals[di][1][j];m.name=document.getElementById(id+'n').value.trim()||m.name;m.text=document.getElementById(id+'t').value.trim()||m.text;m.kcal=+document.getElementById(id+'k').value||0;m.protein=+document.getElementById(id+'p').value||0;save();renderAll()}
function estimateMeal(di,j){const id=`m${di}_${j}`,e=estimate(document.getElementById(id+'t').value);if(!e)return alert('Kjenner ikkje igjen nok av maten. Skriv inn kcal og protein manuelt frå pakka.');document.getElementById(id+'k').value=e[0];document.getElementById(id+'p').value=e[1]}
function resetMeal(di,j){if(!confirm('Tilbakestille dette måltidet til original plan?'))return;const src=DEFAULT_MEALS[di][1][j],m=state.meals[di][1][j];m.name=src[0];m.text=src[1];m.kcal=src[2];m.protein=src[3];save();renderAll()}
function toggleAllMeals(di,w,val){state.meals[di][1].forEach((m,j)=>state.checks[mealKey(w,di,j)]=val);save();renderAll()}
function setFoodWeek(n){state.foodWeek=Math.max(1,Math.min(12,n));save();renderFood()}
function foodDayCard(di,w,open){const d=state.meals[di],[pk,pp]=planTotals(di),done=d[1].filter((m,j)=>state.checks[mealKey(w,di,j)]).length;return `<details class="foodday" ${open?'open':''} ontoggle="if(this.open){state.foodOpenDay=${di};save()}"><summary><div class="foodhead"><div class="foodtitle"><span class="pill">${esc(d[0].slice(0,3))}</span><div><h2>${esc(d[0])}</h2><div class="foodfocus">${esc(FOOD_FOCUS[di])}</div></div></div><div><span class="pill">${done}/${d[1].length}</span><div class="tiny" style="margin-top:5px;text-align:right">≈ ${pk} kcal · ${pp} g protein</div></div></div></summary><div class="fooddaybody">${bars(di,w)}<div class="actions"><button class="btn small green" onclick="toggleAllMeals(${di},${w},true)">Huk av alle</button><button class="btn small alt" onclick="toggleAllMeals(${di},${w},false)">Nullstill dagen</button></div>${d[1].map((m,j)=>mealRow(di,j,w,true)).join('')}</div></details>`}
function renderToday(){const i=info(),w=state.weeks[i.week-1],si={0:0,2:1,4:2}[i.di];let h=`<div class="card accent"><div class="daytitle">Veke ${i.week}</div><div class="muted">${esc(w.phase)} · ${esc(state.meals[i.di][0])}</div></div>`;if(si!==undefined){const s=w.sessions[si];h+=`<div class="card"><h3>Dagens økt</h3><div class="muted">${esc(s.name)} · ${esc(s.day)}</div>${s.exercises.map(e=>`<div class="exercise"><b>${esc(e.name)}</b><div class="muted">${esc(e.sets)}${e.suggestedWeight!=null?` • forslag ${e.suggestedWeight} kg`:''}</div></div>`).join('')}</div>`}else h+=`<div class="card"><h3>Dagens økt</h3><div class="muted">Ingen planlagt hovudøkt i dag. Kvile eller lett aktivitet.</div></div>`;h+=`<div class="card"><div class="sectionhead"><div><h3>Dagens mat</h3><div class="tiny">${esc(FOOD_FOCUS[i.di])}</div></div><button class="btn small alt" onclick="state.foodWeek=${i.week};state.foodOpenDay=${i.di};save();tab('food');renderFood()">Opne matplan</button></div>${bars(i.di,i.week)}${state.meals[i.di][1].map((m,j)=>mealRow(i.di,j,i.week,false)).join('')}</div>`;document.getElementById('today').innerHTML=h}
function renderFood(){const cur=info(),w=state.foodWeek||cur.week;document.getElementById('food').innerHTML=`<div class="card accent"><h2>Mat for jamn nedgang og god trening</h2><p class="tiny">Inspirert av oppsettet i Anita-appen: kvar dag har eige fokus, planlagde totalsummar og framdrift for det som faktisk er ete.</p><div class="notice">Kcal og protein er overslag. Målet er ikkje å treffe kvart tal perfekt kvar dag, men å ligge nær planen over tid og ha nok protein til styrketreninga.</div><div class="formgrid" style="margin-top:12px"><label class="tiny">Dagsmål kcal<input type="number" value="${state.kcalGoal}" onchange="state.kcalGoal=+this.value;save();renderAll()"></label><label class="tiny">Dagsmål protein<input type="number" value="${state.proteinGoal}" onchange="state.proteinGoal=+this.value;save();renderAll()"></label></div><div class="weeknav"><button class="btn alt" ${w<=1?'disabled':''} onclick="setFoodWeek(${w-1})">‹</button><strong>Veke ${w}</strong><button class="btn alt" ${w>=12?'disabled':''} onclick="setFoodWeek(${w+1})">›</button></div></div><div class="card bluecard"><h2>Tre enkle reglar</h2><div class="factorlist"><div class="factor"><span>Styrke/intervall</span><strong>Karbohydrat før</strong></div><div class="factor"><span>Etter trening</span><strong>Protein + vanleg måltid</strong></div><div class="factor"><span>Vektnedgang</span><strong>Jamn plan, ikkje krasjdiett</strong></div></div></div>${state.meals.map((d,di)=>foodDayCard(di,w,di===state.foodOpenDay)).join('')}`}
function renderWeight(){const a=[...state.weights].sort((a,b)=>b.date.localeCompare(a.date));document.getElementById('weight').innerHTML=`<div class="card"><h2>Vektlogg</h2><div class="tiny">Veg helst 2–3 morgonar i veka og sjå på gjennomsnittet, ikkje enkeltdagar.</div><div class="formgrid" style="margin-top:10px"><input id="wd" type="date" value="${new Date().toISOString().slice(0,10)}"><input id="wv" type="number" step="0.1" placeholder="kg"></div><button class="btn" style="margin-top:10px" onclick="addWeight()">Lagre vekt</button>${a.map(x=>`<div class="weightitem"><span>${x.date}</span><b>${x.value} kg</b></div>`).join('')}</div><div class="card"><h3>Startdato</h3><input type="date" value="${state.start}" onchange="state.start=this.value;save();renderAll()"></div>`}
function addWeight(){const d=document.getElementById('wd').value,v=parseFloat(document.getElementById('wv').value);if(!d||!v)return;state.weights=state.weights.filter(x=>x.date!==d);state.weights.push({date:d,value:v});save();renderWeight()}
function toggleShop(id,val){state.shopChecks[id]=val;save();renderShop()}
function clearShop(){state.shopChecks={};save();renderShop()}
function addShopItem(){const name=document.getElementById('shop-name').value.trim(),qty=document.getElementById('shop-qty').value.trim(),category=document.getElementById('shop-category').value;if(!name)return alert('Skriv inn ei vare.');state.shopping.push({id:'custom-'+Date.now(),category,name,qty:qty||'etter behov',custom:true});save();renderShop()}
function removeShopItem(id){state.shopping=state.shopping.filter(x=>x.id!==id);delete state.shopChecks[id];save();renderShop()}
function renderShop(){const cats=[...new Set(state.shopping.map(x=>x.category))],checked=state.shopping.filter(x=>state.shopChecks[x.id]).length;document.getElementById('shop').innerHTML=`<div class="card accent"><div class="sectionhead"><div><h2>Handleliste</h2><div class="tiny">Varer for den vanlege matplanen – alt skal normalt finnast på REMA 1000.</div></div><span class="pill">${checked}/${state.shopping.length}</span></div>${cats.map(c=>`<div class="shopgroup"><h3>${esc(c)}</h3>${state.shopping.filter(x=>x.category===c).map(x=>`<div class="shoprow"><label class="row shopname"><input type="checkbox" ${state.shopChecks[x.id]?'checked':''} onchange="toggleShop('${x.id}',this.checked)"><span>${esc(x.name)}</span></label><div class="shopqty">${esc(x.qty)}${x.custom?`<br><button class="btn small danger" onclick="removeShopItem('${x.id}')">Fjern</button>`:''}</div></div>`).join('')}</div>`).join('')}<button class="btn alt" style="margin-top:15px" onclick="clearShop()">Fjern alle avhukingar</button></div><div class="card"><h2>Legg til vare</h2><div class="formgrid"><label class="tiny">Vare<input id="shop-name"></label><label class="tiny">Mengde<input id="shop-qty"></label></div><label class="tiny">Kategori<select id="shop-category"><option>Karbohydrat</option><option>Meieri og protein</option><option>Kjøtt og fisk</option><option>Frukt og grønt</option><option>Anna</option></select></label><button class="btn green" style="margin-top:10px" onclick="addShopItem()">Legg til</button></div>`}
function renderAll(){renderToday();renderTraining();renderFood();renderWeight();renderShop()}
(async()=>{migrate(await load());renderAll();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{})})();
</script></body></html>
